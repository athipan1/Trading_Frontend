name: Bootstrap Backtest Visual Baselines

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate reviewed Backtest baselines
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/phase-9-backtest'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate only missing Backtest baselines
        shell: bash
        run: |
          set -euo pipefail

          snapshot_dir='e2e/visual-regression.spec.js-snapshots'
          expected=(
            "$snapshot_dir/backtest-success-en-desktop-1280-linux.png"
            "$snapshot_dir/backtest-success-en-mobile-320-linux.png"
            "$snapshot_dir/backtest-success-en-tablet-768-linux.png"
            "$snapshot_dir/backtest-success-th-desktop-1280-linux.png"
            "$snapshot_dir/backtest-success-th-mobile-320-linux.png"
            "$snapshot_dir/backtest-success-th-tablet-768-linux.png"
          )

          for path in "${expected[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Refusing to overwrite existing baseline: $path" >&2
              exit 1
            fi
          done

          npx playwright test e2e/visual-regression.spec.js --grep '/backtest' --workers=1 --update-snapshots

          mapfile -t added < <(git ls-files --others --exclude-standard "$snapshot_dir" | sort)
          mapfile -t modified < <(git diff --name-only -- "$snapshot_dir" | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          if (( ${#modified[@]} != 0 )); then
            printf 'Existing visual baselines were modified:\n%s\n' "${modified[*]}" >&2
            exit 1
          fi

          if ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${added[@]}"); then
            echo 'Generated baseline set does not match the six reviewed Backtest cases.' >&2
            exit 1
          fi

          npm run test:visual

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'test: approve backtest visual baselines'
          git push origin "HEAD:${{ github.head_ref }}"

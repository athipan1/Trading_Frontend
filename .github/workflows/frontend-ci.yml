name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, build, and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate copied Manager snapshot fixtures
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.cwd(), 'tests/fixtures/dashboard');
          const expected = new Set([
            'success.json',
            'no-candidate.json',
            'risk-rejected.json',
            'execution-success.json',
            'execution-failure.json',
            'workflow-failure.json',
            'cancelled.json',
            'stale.json',
            'masked.json',
          ]);
          const files = fs.readdirSync(directory).filter((name) => name.endsWith('.json'));
          for (const name of expected) {
            if (!files.includes(name)) throw new Error(`Missing contract fixture: ${name}`);
            const payload = JSON.parse(fs.readFileSync(path.join(directory, name), 'utf8'));
            if (payload.schemaVersion !== 'dashboard-snapshot.v2') throw new Error(`Invalid schema in ${name}`);
            if (payload.runtime.liveTradingEnabled !== false) throw new Error(`Unsafe runtime in ${name}`);
          }
          NODE

      - name: Lint
        id: lint
        run: npm run lint -- --format json --output-file eslint-report.json

      - name: Upload lint failure report
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-eslint-report
          path: eslint-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Unit tests and coverage gate
        run: npm run test:coverage

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 7

      - name: Production public-snapshot build
        run: npm run build
        env:
          VITE_DATA_SOURCE: public-snapshot
          VITE_MANAGER_API_URL: ""
          VITE_DASHBOARD_SNAPSHOT_URL: https://raw.githubusercontent.com/athipan1/Manager_Agent/dashboard-data/docs/dashboard/latest-dashboard-snapshot.json
          VITE_REFRESH_INTERVAL_MS: 60000
          ALPACA_SECRET_KEY: frontend-ci-secret-must-not-leak

      - name: Enforce bundle performance budgets
        run: npm run check:performance:bundle

      - name: Upload bundle performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-performance
          path: performance-artifacts/bundle-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify secrets are absent from bundle
        run: npm run check:bundle
        env:
          BUNDLE_FORBIDDEN_VALUES: frontend-ci-secret-must-not-leak

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image and health check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pinned optional Manager-control image
        run: >-
          docker build
          --build-arg VITE_DATA_SOURCE=manager-api
          --build-arg VITE_MANAGER_API_URL=/api
          --build-arg VITE_REFRESH_INTERVAL_MS=60000
          --tag trading-frontend:ci .

      - name: Start container
        run: docker run --detach --name trading-frontend-ci --publish 8080:8080 trading-frontend:ci

      - name: Verify container health endpoint and security headers
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs trading-frontend-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -i "x-content-type-options: nosniff"

      - name: Container logs
        if: failure()
        run: docker logs trading-frontend-ci

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run functional browser tests
        run: npm run test:e2e:functional

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-e2e-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  performance:
    name: Performance budget gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run mobile Web Vitals and runtime budgets
        run: npm run test:performance

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-performance-budget
          path: |
            performance-artifacts
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  accessibility:
    name: Axe accessibility gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run axe WCAG accessibility gate
        run: npm run test:a11y

      - name: Upload accessibility failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-accessibility-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  visual-regression:
    name: Visual regression gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Compare UI against committed baselines
        run: npm run test:visual

      - name: Upload visual actual, expected, and diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-regression-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

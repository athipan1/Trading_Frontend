name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          VITE_USE_MOCK_DATA: true

  api-connectivity:
    name: Agent API connectivity
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check agent APIs
        run: node scripts/check-agent-apis.mjs
        env:
          API_CHECK_STRICT: false
          API_CHECK_TIMEOUT_MS: 8000
          MANAGER_API_URL: ${{ vars.MANAGER_API_URL }}
          DATABASE_API_URL: ${{ vars.DATABASE_API_URL }}
          EXECUTION_API_URL: ${{ vars.EXECUTION_API_URL }}
          RISK_API_URL: ${{ vars.RISK_API_URL }}
          CURATOR_API_URL: ${{ vars.CURATOR_API_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}

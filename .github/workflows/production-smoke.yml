name: Production Deployment Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '35 */6 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trading-frontend-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    name: Verify Vercel public snapshot deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_URL: https://trading-frontend-wheat-pi.vercel.app/
      PRODUCTION_SMOKE_ATTEMPTS: '24'
      PRODUCTION_SMOKE_DELAY_MS: '15000'
      PRODUCTION_SMOKE_NAVIGATION_TIMEOUT_MS: '30000'
      PRODUCTION_SMOKE_ARTIFACT_DIR: production-smoke-artifacts

    steps:
      - name: Checkout Trading_Frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Open production and verify Manager snapshot
        run: npm run check:production

      - name: Audit production routes and browser runtime
        run: npm run check:production:routes

      - name: Exercise safe production interactions
        run: npm run check:production:interactions

      - name: Publish smoke summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const rootPath = 'production-smoke-artifacts/report.json';
          const routePath = 'production-smoke-artifacts/route-report.json';
          const interactionPath = 'production-smoke-artifacts/interaction-report.json';
          const readJson = (path) => fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
          const report = readJson(rootPath);
          const routeReport = readJson(routePath);
          const interactionReport = readJson(interactionPath);
          const clean = (value) => String(value ?? '-').replace(/[\r\n|`]/g, ' ');

          if (!report) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Production smoke\n\n❌ Root report was not generated.\n');
            process.exit(0);
          }

          const overallHealthy = report.connected
            && routeReport?.connected !== false
            && interactionReport?.connected !== false;
          const status = overallHealthy
            ? report.staleDataVisible || routeReport?.warnings?.length
              ? '⚠️ Deployment healthy, upstream data stale'
              : '✅ Connected, route-clean, and interaction-clean'
            : '❌ Failed';
          const lines = [
            '# Trading_Frontend production smoke',
            '',
            `- Status: ${status}`,
            `- Production: \`${clean(report.productionUrl)}\``,
            `- Data source: \`${clean(report.dataSourceText)}\``,
            `- Schema: \`${clean(report.schemaText)}\``,
            `- Runtime: \`${clean(report.runtimeModeText)}\``,
            `- Manager snapshot HTTP: ${clean(report.managerSnapshotStatus)}`,
            `- Stale warning visible: \`${clean(report.staleDataVisible)}\``,
            `- Operator control exposed: \`${clean(report.operatorControlExposed)}\``,
            `- Attempts: ${clean(report.attemptsUsed)}`,
            `- Route checks: ${clean(routeReport?.routesPassed ?? 0)}/${clean(routeReport?.routesChecked ?? 0)} passed`,
            `- Interaction checks: ${clean(interactionReport?.interactionsPassed ?? 0)}/${clean(interactionReport?.interactionsChecked ?? 0)} passed`,
            `- Viewports: \`${clean(routeReport?.viewports?.join(', ') || 'not-run')}\``,
          ];

          const warnings = [
            ...(Array.isArray(report.warnings) ? report.warnings : []),
            ...(Array.isArray(routeReport?.warnings) ? routeReport.warnings : []),
          ].join('; ');
          const errors = [
            ...(Array.isArray(report.errors) ? report.errors : []),
            ...(Array.isArray(routeReport?.errors) ? routeReport.errors : []),
            ...(Array.isArray(interactionReport?.errors) ? interactionReport.errors : []),
          ].map((item) => item?.message || item).join('; ');
          if (warnings) lines.push(`- Warning: ${clean(warnings)}`);
          if (errors) lines.push(`- Error: ${clean(errors)}`);

          if (Array.isArray(routeReport?.routeResults) && routeReport.routeResults.length) {
            lines.push('', '## Production route matrix', '', '| Viewport | Route | Result | HTTP | Overflow | Runtime issues |', '|---|---|---:|---:|---:|---:|');
            for (const item of routeReport.routeResults) {
              lines.push(`| ${clean(item.viewport)} | \`${clean(item.route)}\` | ${item.status === 'passed' ? '✅' : '❌'} | ${clean(item.pageStatus)} | ${clean(item.overflow)} | ${clean(item.runtime?.total ?? (item.status === 'passed' ? 0 : '-'))} |`);
            }
          } else {
            lines.push('', '⚠️ Production route matrix did not run or did not produce a report.');
          }

          if (Array.isArray(interactionReport?.interactionResults) && interactionReport.interactionResults.length) {
            lines.push('', '## Production interaction matrix', '', '| Interaction | Result | Runtime issues |', '|---|---:|---:|');
            for (const item of interactionReport.interactionResults) {
              lines.push(`| ${clean(item.name)} | ${item.status === 'passed' ? '✅' : '❌'} | ${clean(item.runtime?.total ?? (item.status === 'passed' ? 0 : '-'))} |`);
            }
          } else {
            lines.push('', '⚠️ Production interaction matrix did not run or did not produce a report.');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-frontend-production-smoke
          path: production-smoke-artifacts
          if-no-files-found: error
          retention-days: 14
